# Shield CLI configuration.
# Load with: go run ./cmd/shield -config=shieldconfig.toml

results_dir = "results/tests"

[run]
# Comma-free list values; exact name match against registered units/atoms.
unit_blacklist = []
atom_blacklist = []

# true -> write run artifacts using configured mode.
persist = true

# json | txt | both
mode = "json"
out_dir = ""

# Optional named targets used via: run <target>
[targets.fast]
mode = "json"
persist = true

[targets.ci]
mode = "both"
persist = true

[targets.tests]
entrypoint_kind = "go_test"
entrypoint = "./tests"
test_run_pattern = "^TestShieldFrameworkSample$"
entrypoint_args = ["-count=1", "-v"]

